apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ehb-web:latest
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "scripts/dmo-worker.ts"]
          envFrom:
            - configMapRef:
                name: ehb-config
