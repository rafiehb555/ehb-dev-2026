apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ehb-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: ehb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
