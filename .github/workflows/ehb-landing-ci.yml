# CI for the Next.js app in `apps/web/` (formerly `EHB landing-2026/`)
name: EHB Web CI

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/ehb-landing-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/ehb-landing-ci.yml"

defaults:
  run:
    working-directory: "apps/web"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install
        run: npm ci

      # Exits non-zero while Next 14 + eslint-config-next carry known highs; does not fail the job.
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
