# CI for the Next.js app in `EHB landing-2026/`
name: EHB Landing CI

on:
  push:
    paths:
      - "EHB landing-2026/**"
      - ".github/workflows/ehb-landing-ci.yml"
  pull_request:
    paths:
      - "EHB landing-2026/**"
      - ".github/workflows/ehb-landing-ci.yml"

defaults:
  run:
    working-directory: "EHB landing-2026"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "EHB landing-2026/package-lock.json"

      - name: Install
        run: npm ci

      # Exits non-zero while Next 14 + eslint-config-next carry known highs; does not fail the job.
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
